# Конфигурация nginx для ZT Lab.
# Файл ставится на VPS: /etc/nginx/sites-available/ztlab
# Затем:  ln -s /etc/nginx/sites-available/ztlab /etc/nginx/sites-enabled/
#         rm /etc/nginx/sites-enabled/default
#         nginx -t && systemctl reload nginx
#
# Схема: интернет -> nginx на VPS -> WireGuard -> Node на ноутбуке.
# Наружу торчит только VPS. База и 3D-файлы лежат на ноутбуке.
#
# Проверено на Ubuntu 24.04 (nginx 1.24). На более новом nginx
# строку "http2" нужно убрать из listen и добавить отдельную
# директиву "http2 on;".

# Защита от слишком частых запросов на уровне nginx.
# Дублирует ограничение в приложении, но срабатывает раньше
# и не тратит ресурсы Node.
limit_req_zone $binary_remote_addr zone=ztlab_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ztlab_general:10m rate=30r/s;

upstream ztlab_app {
    # Адрес ноутбука в сети WireGuard. Замените на свой.
    server 10.8.0.2:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ztbase.ru www.ztbase.ru;

    # Обязательное требование Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ztbase.ru www.ztbase.ru;

    # Пути к сертификату: выпустит certbot.
    ssl_certificate     /etc/letsencrypt/live/ztbase.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ztbase.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ВНИМАНИЕ: домен в примере — плейсхолдер. Подставьте свой ДО настройки
# DNS, иначе nginx начнёт принимать чужие запросы.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 3D-модели бывают крупными, поэтому лимит тела запроса большой.
    # Должен совпадать с лимитом multer в server.js.
    client_max_body_size 512m;

    # Медленный клиент не должен занимать соединение вечно.
    client_body_timeout 120s;
    client_header_timeout 20s;
    send_timeout 300s;

    server_tokens off;

    access_log /var/log/nginx/ztlab.access.log;
    error_log  /var/log/nginx/ztlab.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Заголовки пересылки ---
    # Приложение доверяет этим адресам (trust proxy), и по ним же
    # считает попытки входа. Без X-Forwarded-For все сотрудники
    # выглядели бы как один адрес nginx, и блокировка по подбору
    # пароля выкидывала бы всю лабораторию разом.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # Страница входа и регистрация: медленные попытки входа
    # гасим на уровне nginx, 20 запросов в минуту с одного адреса.
    location = /set-user {
        limit_req zone=ztlab_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://ztlab_app;
    }

    location = /register-lab {
        limit_req zone=ztlab_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://ztlab_app;
    }

    # Проверка живости: не кэшируем, чтобы мониторинг видел реальное состояние.
    location = /health {
        access_log off;
        proxy_pass http://ztlab_app;
    }

    # Отдача 3D-файлов и картинок. Скачивание может идти долго,
    # поэтому таймауты выше и отключена буферизация ответа.
    location ~ ^/(download|download-image|image)/ {
        proxy_pass http://ztlab_app;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        limit_req zone=ztlab_general burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://ztlab_app;
    }
}
