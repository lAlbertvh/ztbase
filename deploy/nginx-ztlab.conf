# nginx для ZT Lab. Файл ставится на VPS:
#   /etc/nginx/sites-available/ztlab
#
# Раскладка:
#   ztbase.ru            -> статический лендинг с диска VPS
#   www.ztbase.ru        -> Node на ноутбуке через WireGuard
#
# Почему приложение на www, а не на app.ztbase.ru: панель управления
# доменом не даёт завести новые поддомены, а www уже создан и уже
# покрыт выпущенным сертификатом. Менять DNS и перевыпускать
# сертификат не нужно — сайт работает сразу.
#
# Если позже появится возможность добавить поддомен, блок приложения
# переносится на server_name app.ztbase.ru, а www возвращается к
# лендингу как зеркало.
#
# Наружу торчит только VPS: база, 3D-файлы и сам Node живут на ноутбуке
# по адресу 10.8.0.2 в сети WireGuard. Порт ноутбука наружу не открыт.
#
# Почему не по пути /app: во всех шаблонах пути абсолютные
# (/orders, /login, /manifest.json), а PWA-воркер имеет scope "/".
# Под префиксом пути всё это перестало бы работать.
#
# Проверено на Ubuntu 24.04 (nginx 1.24): директивы http2 on; в этой
# версии ещё нет, поэтому протокол указан в listen.

# Ограничения запросов. Дублируют счётчики в приложении, но срабатывают
# раньше и не тратят процессы Node.
limit_req_zone $binary_remote_addr zone=ztlab_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ztlab_general:10m rate=30r/s;

# Апстрим объявлен здесь, а не внутри server: директива upstream
# допустима только в контексте http.
#
# Адрес 127.0.0.1 — это порт на самом VPS, куда попадает обратный
# SSH-туннель с ноутбука. Приложение слушает только свой localhost и
# наружу из интернета не выставлено вовсе: достучаться до него можно
# лишь через туннель, который поднимает ноутбук.
#
# Прямой WireGuard не используется: провайдер фильтрует его трафик,
# туннель живёт одну-две минуты и умирает. SSH по TCP работает стабильно.
upstream ztlab_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ------------------------------------------------------------------
# Лендинг
# ------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ztbase.ru;

    # Проверка домена Let's Encrypt идёт по HTTP, поэтому исключение
    # обязано стоять до принудительного перехода на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/ztbase.ru;
    }

    location / {
        return 301 https://ztbase.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ztbase.ru;

    # Оба имени уже отдаются только по HTTPS (listen 80 ведёт на 301),
    # поэтому браузеру можно сказать не возвращаться на HTTP вовсе:
    # так не работает SSL-strip, когда посреди соединения выдавливают
    # предупреждение браузера и уводят на незащищённый адрес.
    # includeSubDomains не указан: что ещё живёт на поддоменах
    # ztbase.ru, отсюда не видно, а заголовок браузеру необратим.
    add_header Strict-Transport-Security "max-age=15552000" always;

    root /var/www/ztbase.ru;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/ztbase.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ztbase.ru/privkey.pem;
    include /etc/nginx/snippets/ztlab-tls.conf;

    server_tokens off;
    access_log /var/log/nginx/ztbase.access.log;
    error_log  /var/log/nginx/ztbase.error.log;

    # Лендинг статический: сжатие и кэш в браузере экономят трафик.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Иконки меняются редко — держим подольше.
    location ~* \.(png|jpg|jpeg|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; log_not_found off; }

    # Приватные файлы на лендинге отсутствуют. Здесь ищем служебные
    # имена, которыми пользуются боты, и отдаём 404 без записи в лог.
    location ~* \.(env|git|sql|bak|conf|ini|log)$ {
        return 404;
    }
}

# ------------------------------------------------------------------
# Приложение
# ------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.ztbase.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/ztbase.ru;
    }

    location / {
        return 301 https://www.ztbase.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ztbase.ru;

    add_header Strict-Transport-Security "max-age=15552000" always;

    ssl_certificate     /etc/letsencrypt/live/ztbase.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ztbase.ru/privkey.pem;
    include /etc/nginx/snippets/ztlab-tls.conf;

    # 3D-модели бывают крупными, поэтому лимит тела запроса большой.
    # Должен совпадать с лимитом multer в server.js.
    client_max_body_size 512m;
    client_body_timeout 120s;
    client_header_timeout 20s;
    send_timeout 300s;

    server_tokens off;
    access_log /var/log/nginx/ztlab.access.log;
    error_log  /var/log/nginx/ztlab.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Заголовки пересылки. Приложение доверяет этим адресам
    # (trust proxy) и по ним же считает попытки входа. Без
    # X-Forwarded-For все сотрудники выглядели бы как один адрес
    # nginx, и блокировка по подбору пароля выкинула бы всю
    # лабораторию разом.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # Страница входа и регистрация: 20 попыток в минуту с адреса.
    location = /set-user {
        limit_req zone=ztlab_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ztlab_app;
    }

    location = /register-lab {
        limit_req zone=ztlab_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ztlab_app;
    }

    # Проверка живости: не кэшируем, чтобы мониторинг видел реальное
    # состояние туннеля.
    location = /health {
        access_log off;
        proxy_pass http://ztlab_app;
    }

    # Отдача 3D-файлов: скачивание идёт долго, поэтому длинные
    # таймауты и без буферизации ответа.
    location ~ ^/(download|download-image|image)/ {
        proxy_pass http://ztlab_app;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        limit_req zone=ztlab_general burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://ztlab_app;
    }
}
