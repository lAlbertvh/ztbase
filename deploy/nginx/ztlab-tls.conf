# Общие настройки TLS для обоих сайтов ZT Lab.
# Файл: /etc/nginx/snippets/ztlab-tls.conf
#
# Вынесено отдельно, потому что сертификаты выпускаются и продлеваются
# независимо для ztbase.ru и app.ztbase.ru, а сами параметры соединения
# у сайтов одинаковые.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

# В OCSP stapling нельзя бездумно включать: если CA не отвечает,
# сайт перестаёт открываться у части клиентов. Включать после того,
# как stapling заработает без ошибок.
# ssl_stapling on;
# ssl_stapling_verify on;

ssl_session_cache shared:ZTLAB:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# HSTS включаем только когда оба домена гарантированно работают по
# HTTPS: браузер запомнит это на годы, и откатить будет трудно.
# Включать одной строкой раскомментирования.
# add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
