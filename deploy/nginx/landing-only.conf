# nginx для ZT Lab. Файл ставится на VPS:
#   /etc/nginx/sites-available/ztlab
#
# Раскладка:
#   ztbase.ru, www.ztbase.ru  -> статический лендинг с диска VPS
#   app.ztbase.ru             -> Node на этом же VPS
#
# Наружу торчит только VPS. Приложение, база и 3D-файлы живут на этой же
# машине, Node слушает петлю, и порт 3000 в интернет не открыт.
#
# Почему приложение на поддомене, а не по пути /app:
# во всех шаблонах пути абсолютные (/orders, /login, /manifest.json),
# а PWA-воркер имеет scope "/". Под префиксом пути всё это сломалось бы.
#
# Проверено на Ubuntu 24.04 (nginx 1.24).

# Ограничения запросов. Дублируют счётчики в приложении, но срабатывают
# раньше и не тратят процессы Node.
limit_req_zone $binary_remote_addr zone=ztlab_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ztlab_general:10m rate=30r/s;

# Общий кусок заголовков для обоих сайтов.
# include /etc/nginx/snippets/ztlab-security.conf;

# ------------------------------------------------------------------
# Лендинг и переадресация www
# ------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ztbase.ru www.ztbase.ru;

    # Проверка домена Let's Encrypt идёт по HTTP, поэтому исключение
    # обязано быть до принудительного перехода на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/ztbase.ru;
    }

    location / {
        return 301 https://ztbase.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
      server_name www.ztbase.ru;

    # www живёт только как зеркало лендинга: дублировать сайт
    # на двух адресах вредно для поиска.
    ssl_certificate     /etc/letsencrypt/live/ztbase.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ztbase.ru/privkey.pem;
    include /etc/nginx/snippets/ztlab-tls.conf;

    return 301 https://ztbase.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
      server_name ztbase.ru;

    root /var/www/ztbase.ru;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/ztbase.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ztbase.ru/privkey.pem;
    include /etc/nginx/snippets/ztlab-tls.conf;

    server_tokens off;
    access_log /var/log/nginx/ztbase.access.log;
    error_log  /var/log/nginx/ztbase.error.log;

    # Лендинг статический: сжатие и кэш в браузере экономят трафик.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Страница по умолчанию не должна отдаваться как каталог.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Иконки и манифест меняются редко — держим подольше.
    location ~* \.(png|jpg|jpeg|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    # Приватность и оферта меняются вместе с реквизитами, но не часто.
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; log_not_found off; }

    # Ботов, которые ищут панели управления, здесь нечего проверять:
    # приложения на этом домене нет. Отдаём 404 без попадания в лог.
    location ~* \.(env|git|sql|bak|conf|ini|log)$ {
        return 404;
    }

    error_page 404 /404.html;
}

# ------------------------------------------------------------------
# Приложение на app.ztbase.ru будет добавлен отдельным шагом,
# когда появится DNS-запись и сертификат для поддомена.
# ------------------------------------------------------------------
